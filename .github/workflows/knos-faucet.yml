# .github/workflows/knos-faucet.yml: the test USDC faucet of the playground, and nothing else.
#
# It is the `faucet` job of drexthealpha/Knos's .github/workflows/worker.yml, copied as a file of its own, so that the
# playground runs the faucet without the worker's relay job (which would start a second chain of relay runs here).
# `/knos faucet <address | passkey>` on the issue labelled `faucet` gives 20 test USDC, which has no monetary value
# (https://github.com/drexthealpha/Knos/blob/main/docs/FAUCET.md). It checks out Knos's own code and runs
# `python -m knos.faucet`; nothing of a pull request runs here. Secrets: KNOS_FAUCET_KEY (holds test USDC only) and
# KNOS_WORKER_KEY (the relay's key: pays the fee), read by this job only.
name: knos faucet

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  faucet:
    if: >-
      github.event_name == 'issue_comment' && github.repository == (vars.KNOS_FAUCET_REPO || 'drexthealpha/knos-playground')
      && !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'faucet')
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write         # the faucet's one reply, and its edit
    concurrency:
      group: knos-faucet
      cancel-in-progress: false
    env:
      KNOS_HOME: ${{ github.workspace }}/.knos-faucet-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: drexthealpha/Knos
          ref: ${{ vars.KNOS_FAUCET_REF || 'main' }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false
      - name: install what the faucet needs, each by its hash, and nothing else
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r requirements/faucet.txt
          echo "$RUNNER_TEMP/knos/bin" >> "$GITHUB_PATH"
      - name: answer the request, once
        env:
          KNOS_FAUCET_KEY: ${{ secrets.KNOS_FAUCET_KEY }}
          KNOS_RELAY_KEY: ${{ secrets.KNOS_RELAY_KEY || secrets.KNOS_WORKER_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          [ -n "$KNOS_FAUCET_KEY" ] || { echo "no KNOS_FAUCET_KEY secret: the faucet answers nobody here. Skipped."; exit 0; }
          [ -n "$KNOS_RELAY_KEY" ] || { echo "no KNOS_RELAY_KEY secret: nothing would pay the transfer's fee. Skipped."; exit 0; }
          python -m knos.faucet --event "$GITHUB_EVENT_PATH"
